# Dependency updates, grouped so they arrive as a few PRs per week.
#
# Commit prefixes: production dependencies and the Docker base image use
# `fix(deps)`, dev dependencies `chore(deps)`, GitHub Actions `ci`. Merging any
# of them to master publishes a new image.
#
# Major versions are ignored for npm and Docker. Upgrade those on purpose, with
# testing (Next.js, React, @notionhq/client, Node). Actions majors stay on: they
# are commit-SHA pins and CI runs them.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
        update-types: ['minor', 'patch']
      development:
        dependency-type: development
        update-types: ['minor', 'patch']
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)

  - package-ecosystem: npm
    directory: /widget
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      widget-production:
        dependency-type: production
        update-types: ['minor', 'patch']
      widget-development:
        dependency-type: development
        update-types: ['minor', 'patch']
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix(deps)
