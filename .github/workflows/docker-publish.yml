name: Publish Docker image

# Every push to master that passes CI publishes a new image:
#   :latest          the newest build
#   :sha-<commit>    this exact build, for pinning and rollback
# Run it by hand ("Run workflow") to rebuild the image for the current master.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only after a successful CI run for a push (not for a pull request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # One publish at a time, in start order, so an older build never moves
    # :latest back. A newer pending run replaces an older pending one.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    steps:
      - name: Pick the commit to build
        id: commit
        env:
          # Passed through the environment, never interpolated into the script.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown in /admin, /api/health and /api/v1/config.
          build-args: |
            APP_VERSION=sha-${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
