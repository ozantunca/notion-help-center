name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.3.0; pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: notion-help-center:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for /api/health
        # The check runs curl *inside* the container, as hosting platforms such as
        # Coolify do, so CI fails if the image ever loses curl again.
        run: |
          docker run -d --name nhc notion-help-center:ci
          for i in $(seq 1 30); do
            if docker exec nhc curl -sf http://localhost:3000/api/health; then
              echo
              docker exec nhc curl -sf -o /dev/null -w "GET / -> %{http_code}\n" http://localhost:3000/
              exit 0
            fi
            sleep 2
          done
          docker logs nhc
          exit 1
