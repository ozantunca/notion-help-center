name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: notion-help-center:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for /api/health
        run: |
          docker run -d --name nhc -p 3000:3000 notion-help-center:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs nhc
          exit 1
